media:
  input: images
  output: /images

content:
  # 1. STANDAARD ALGEMENE PAGINA'S (Zonder de contactpagina)
  - name: pages
    label: Algemene Pagina's
    type: collection
    path: /
    format: yaml-frontmatter
    extension: md
    filename: "{slug}.md"
    files:
      - { name: home, label: Homepagina, path: index.md }
      - { name: over-ons, label: Over Ons, path: over-ons.md }
      - { name: projecten, label: Projecten Overzicht, path: projecten.md }
      - { name: privacy, label: Privacy Policy, path: privacy.md }
      - { name: voorwaarden, label: Algemene Voorwaarden, path: voorwaarden.md }
      - { name: bedankt, label: Bedankpagina, path: bedankt.md }
    fields:
      - { name: title, label: Pagina Titel, type: string, required: true }
      - { name: description, label: Description, type: string, required: true }
      - { name: layout, label: Layout, type: string, default: default, hidden: true }
      - { name: og_image, label: Uitgelichte Afbeelding (Social Media - 1200x630), type: image }
      - { name: body, label: Inhoud, type: rich-text }

  # 2. UNIEKE INRICHTING SPECIFIEK VOOR DE CONTACTPAGINA
  - name: contact_page
    label: Contactpagina Beheer
    type: collection
    path: /
    format: yaml-frontmatter
    files:
      - { name: contact, label: Contact Gegevens, path: contact.md }
    fields:
      - { name: title, label: Pagina Titel, type: string, required: true }
      - { name: description, label: Description, type: string, required: true }
      - { name: layout, label: Layout, type: string, default: contact-layout, hidden: true }
      - { name: featured_image, label: Afbeelding (Linkerkolom), type: image } # <--- DIT VELD STAAT NU DAADWERKELIJK IN DE HOOFDLIJST EN IS DIRECT ZICHTBAAR!
      - { name: og_image, label: Uitgelichte Afbeelding (Social Media - 1200x630), type: image }
      - { name: body, label: Inhoud, type: rich-text }         

   # 3. DYNAMISCHE PORTFOLIOCOLLECTIE (Mijn Werk)
  - name: werk
    label: Mijn Werk / Projecten
    type: collection
    path: _werk/
    extension: md
    filename: "{slug}.md"
    format: yaml-frontmatter
    fields:
      - { name: title, label: Project Titel, type: string, required: true }
      - { name: project_year, label: Project Jaar (bijv. 2026), type: string, required: true }
      - { name: project_location, label: Plaats / Stad, type: string, required: true }
      - name: project_type
        label: Soort Project (Type)
        type: select
        options: ["Campagne", "Editoriaal", "Identiteit", "Signalisatie", "Verpakking", "Web"]
        required: true
      - { name: layout, label: Layout, type: string, default: default, hidden: true }
      - { name: featured_image, label: Project Afbeelding (Linkerkolom), type: image }
      - { name: og_image, label: Uitgelichte Afbeelding (Social Media - 1200x630), type: image }
      - { name: body, label: Project Omschrijving, type: rich-text }

