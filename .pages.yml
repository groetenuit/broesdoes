media:
  input: src/media
  output: /media
content:
  - name: posts
    label: Portfolio
    type: collection
    path: src/posts
    fields:
      - name: title
        label: Titel
        type: string
      - name: body
        label: Inhoud
        type: rich-text
      - name: date
        label: Publicatiedatum
        type: date
  - name: site
    label: Site settings
    type: file
    path: src/_data/site.json
    fields:
      - name: title
        type: string
      - name: description
        type: text
      - name: url
        type: string
actions:
  - name: deploy-site
    label: Deploy site
    workflow: pages-cms-action.yml
