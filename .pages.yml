media:
  input: src/images
  output: /images
  extensions: [jpg, jpeg, png, webp]
  rename: safe

components:
  schermblokken:
    label: Schermvullende blokken
    type: object
    list:
      collapsible:
        collapsed: false
        summary: "{fields.kleur}"
    fields:
      - { name: kleur, label: Achtergrondkleur, type: select, required: true, options: { values: ["Rood", "Donkerbruin", "Geel", "Roos", "Blauw", "mist", "lavendel", "nacht"] } }
      - { name: anker, label: Anker-naam voor interne links (optioneel, bijv. logo of web), type: string }
      - { name: inhoud, label: Inhoud van het blok (gebruik Kop 1 of Kop 2 voor titels), type: rich-text, required: true }

content:
  # Losse pagina's
  - name: home
    label: Homepagina
    type: file
    path: src/index.md
    fields:
      - { name: title, label: Pagina Titel, type: string, required: true }
      - { name: metatitle, label: Meta title, type: string, required: true, options: { maxlength: 60 } }
      - { name: description, label: Meta Description, type: string, required: true, options: { maxlength: 160 } }
      - { name: layout, label: Layout, type: string, default: home, hidden: true }
      - { name: kleur, label: Achtergrondkleur inhoud, type: select, options: { values: ["Rood", "Donkerbruin", "Geel", "Roos", "Blauw", "mist", "lavendel", "nacht"] } }
      - { name: og_image, label: Uitgelichte Afbeelding (Social Media - 1200x630), type: image }
      - { name: blokken, component: schermblokken }
      - { name: body, label: Extra Inhoud (optioneel), type: rich-text }

  - name: services
    label: Services
    type: file
    path: src/services.md
    fields:
      - { name: title, label: Pagina Titel, type: string, required: true }
      - { name: metatitle, label: Meta title, type: string, required: true }
      - { name: description, label: Meta Description, type: string, required: true }
      - { name: layout, label: Layout, type: string, default: default, hidden: true }
      - { name: kleur, label: Achtergrondkleur inhoud, type: select, options: { values: ["Rood", "Donkerbruin", "Geel", "Roos", "Blauw", "mist", "lavendel", "nacht"] } }
      - { name: og_image, label: Uitgelichte Afbeelding (Social Media - 1200x630), type: image }
      - { name: blokken, component: schermblokken }
      - { name: body, label: Extra Inhoud (optioneel), type: rich-text }

  - name: contact
    label: Contactpagina
    type: file
    path: src/contact.md
    fields:
      - { name: title, label: Pagina Titel, type: string, required: true }
      - { name: metatitle, label: Meta title, type: string, required: true }
      - { name: description, label: Meta Description, type: string, required: true }
      - { name: layout, label: Layout, type: string, default: contact-layout, hidden: true }
      - { name: kleur, label: Achtergrondkleur inhoud, type: select, options: { values: ["Rood", "Donkerbruin", "Geel", "Roos", "Blauw", "mist", "lavendel", "nacht"] } }
      - { name: featured_image, label: Afbeelding (Linkerkolom), type: image }
      - { name: og_image, label: Uitgelichte Afbeelding (Social Media - 1200x630), type: image }
      - { name: body, label: Inhoud, type: rich-text }

  - name: voorwaarden
    label: Voorwaarden
    type: file
    path: src/voorwaarden.md
    fields:
      - { name: title, label: Pagina Titel, type: string, required: true }
      - { name: metatitle, label: Meta title, type: string, required: true }
      - { name: description, label: Meta Description, type: string, required: true }
      - { name: layout, label: Layout, type: string, default: contact-layout, hidden: true }
      - { name: kleur, label: Achtergrondkleur inhoud, type: select, options: { values: ["Rood", "Donkerbruin", "Geel", "Roos", "Blauw", "mist", "lavendel", "nacht"] } }
      - { name: og_image, label: Uitgelichte Afbeelding (Social Media - 1200x630), type: image }
      - { name: body, label: Inhoud, type: rich-text }

  # Portfolio: één bestand per project in src/werk
  - name: werk
    label: Mijn Werk / Projecten
    type: collection
    path: src/werk
    filename: "{primary}.md"
    fields:
      - { name: title, label: Pagina Titel, type: string, required: true }
      - { name: metatitle, label: Meta title, type: string, required: true }
      - { name: description, label: Meta Description, type: string, required: true }
      - { name: project_year, label: Project Jaar (bijv. 2026), type: string }
      - { name: project_location, label: Plaats / Stad, type: string }
      - name: project_type
        label: Soort Project (Type)
        type: select
        required: true
        options:
          values: ["Campagne", "Editoriaal", "Eigen werk"]
      - { name: kleur, label: Achtergrondkleur inhoud, type: select, options: { values: ["Rood", "Donkerbruin", "Geel", "Roos", "Blauw", "mist", "lavendel", "nacht"] } }
      - { name: featured_image, label: Project Afbeelding (Linkerkolom), type: image }
      - { name: og_image, label: Uitgelichte Afbeelding (Social Media - 1200x630), type: image }
      - { name: body, label: Project Omschrijving, type: rich-text }
    view:
      primary: title
