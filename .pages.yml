media:
  output: images
  path: /images

# We definiëren de losse pagina's als losse Markdown-bestanden
content:
  - name: pages
    label: Pagina's
    type: collection
    path: /
    format: yaml-frontmatter
    exclude: ["README.md", "LICENSE"]
    fields:
      - name: title
        label: Pagina Titel
        type: string
        required: true
      - name: layout
        label: Layout (Laat op default staan)
        type: string
        default: default
        hidden: true
      - name: body
        label: Inhoud van de pagina
        type: rich-text
      - name: cover
        label: Cover image
        type: image
        options:
        media: images
  - name: site
    label: Site settings
    type: file
    path: src/_data/site.json
    fields:
      - name: title
        type: string
      - name: description
        type: text
      - name: url
        type: string
actions:
  - name: deploy-site
    label: Deploy site
    workflow: pages-cms-action.yml
