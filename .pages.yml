media:
  input: images
  output: /images

content:
  # 1. Vaste algemene pagina's van de site
  - name: pages
    label: Algemene Pagina's
    type: collection
    path: /
    format: yaml-frontmatter
    extension: md
    filename: "{slug}.md"
    files:
      # HOMEPAGINA
      - name: home
        label: Homepagina
        path: index.md
        fields:
          - { name: title, label: Pagina Titel, type: string, required: true }
          - { name: description, label: Description, type: string, required: true }
          - { name: layout, label: Layout, type: string, default: home, hidden: true }
          - { name: og_image, label: Uitgelichte Afbeelding (Social Media - 1200x630), type: image }
          - { name: body, label: Inhoud, type: rich-text }

      - { name: over-ons, label: Over Ons, path: over-ons.md }
      - { name: projecten, label: Projecten Overzicht, path: projecten.md }
      
      # CONTACTPAGINA (Nu perfect uitgelijnd met de juiste streepjes)
      - name: contact
        label: Contact
        path: contact.md
        fields:
          - { name: title, label: Pagina Titel, type: string, required: true }
          - { name: description, label: Description, type: string, required: true }
          - { name: layout, label: Layout, type: string, default: contact-layout, hidden: true }
          - { name: featured_image, label: Afbeelding (Linkerkolom), type: image }
          - { name: og_image, label: Uitgelichte Afbeelding (Social Media - 1200x630), type: image }
          - { name: body, label: Inhoud, type: rich-text }         

      - { name: privacy, label: Privacy Policy, path: privacy.md }
      - { name: voorwaarden, label: Algemene Voorwaarden, path: voorwaarden.md }
      - { name: bedankt, label: Bedankpagina, path: bedankt.md }

    # Standaardvelden voor álle overige algemene pagina's
    fields:
      - { name: title, label: Pagina Titel, type: string, required: true }
      - { name: description, label: Description, type: string, required: true }
      - { name: layout, label: Layout, type: string, default: default, hidden: true }
      - { name: og_image, label: Uitgelichte Afbeelding (Social Media - 1200x630), type: image }
      - { name: body, label: Inhoud, type: rich-text }

  # 2. Dynamische portfoliocollectie
  - name: werk
    label: Mijn Werk / Projecten
    type: collection
    path: _werk/
    extension: md
    filename: "{slug}.md"
    format: yaml-frontmatter
    fields:
      - { name: title, label: Project Titel, type: string, required: true }
      - { name: layout, label: Layout, type: string, default: default, hidden: true }
      - { name: featured_image, label: Project Afbeelding (Linkerkolom), type: image }
      - { name: og_image, label: Uitgelichte Afbeelding (Social Media - 1200x630), type: image }
      - { name: body, label: Project Omschrijving, type: rich-text }
