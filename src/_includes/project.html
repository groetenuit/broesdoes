---
layout: default
---
<section class="p-hero grid12">
  <div class="ph ph--3" style="view-transition-name: b-{{ page.fileSlug }}; view-transition-class: beeld">
    {%- if featured_image %}
    <img src="{{ featured_image | url }}" alt="{{ title }}">
    {%- endif %}
  </div>
  <div class="p-hero-text">
    <h1>{{ title }}</h1>
    <dl class="facts">
      {%- if project_year %}
      <div><dt>Jaar</dt><dd>{{ project_year }}</dd></div>
      {%- endif %}
      {%- if project_location %}
      <div><dt>Plaats</dt><dd>{{ project_location }}</dd></div>
      {%- endif %}
      {%- if project_type %}
      <div><dt>Type</dt><dd>{{ project_type }}</dd></div>
      {%- endif %}
    </dl>
    <div class="p-tekst">
      {{ content }}
    </div>
  </div>
</section>
