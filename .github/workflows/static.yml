# Bouwt de Eleventy-site en publiceert ze op GitHub Pages
name: Deploy naar GitHub Pages

on:
  # Bij elke push naar de hoofdbranch
  push:
    branches: ["main"]

  # Handmatig starten via het tabblad Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Zonder eigen domein: de site staat onder /repo-naam/.
      # Met eigen domein: verwijder het env-blok en zet "origin" in src/_data/site.json op je domein.
      - name: Build
        run: npm run build
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
